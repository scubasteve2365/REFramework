name: PragmataVR build
on:
  push:
    branches: [pragmatavr]
  workflow_dispatch:
env:
  BUILD_TYPE: Release
jobs:
  build-pragmata:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DDEVELOPER_MODE=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target PRAGMATA

      - name: Upload dinput8.dll
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: PRAGMATA-dinput8
          path: ${{github.workspace}}/build/bin/PRAGMATA/dinput8.dll
          if-no-files-found: error
